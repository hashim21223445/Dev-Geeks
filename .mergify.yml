merge_protections:
  - name: Merge during working hours
    description: Make sure to merge only during working hours
    if:
      - base = main
    success_conditions:
      - schedule = Mon-Fri 09:00-17:00[America/Chicago]
  - name: Make sure a JIRA issue is mentioned in the title
    description: Make sure PR title contains a JIRA issue
    if:
      - base = main
    success_conditions:
      - title ~= ^\[\w+-\d+\]
  - name: Make sure a JIRA issue is mentioned in the title
    description: Make sure PR title contains a JIRA issue
    if:
      - base = main
    success_conditions:
      - title ~= ^\[\w+-\d+\]
  - name: Enforce conventional commit
    description: Make sure that we follow https://www.conventionalcommits.org/en/v1.0.0/
    if:
      - base = main
    success_conditions:
      - "title ~=
        ^(fix|feat|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\\(.+\
        \\))?:"
  - name: Force ticket association
    description: Make sure PR has a ticket associated
    if:
      - base = main
    success_conditions:
      - body ~= Fixes
pull_request_rules:
  - name: Request review from team
    description: Request review from a specific team when checks are green.
    conditions:
      - -closed
      - "#approved-reviews-by = 0"
      - "#changes-requested-reviews-by = 0"
      - review-requested != @TEAM_NAME_HERE
    actions:
      request_reviews:
        teams:
          - TEAM_NAME_HERE
